name: Check & deploy to GitHub Pages

# One dependency chain: lint + tests + build must pass before anything is
# published. A red check means nothing deploys.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The suite drives real browsers through Playwright as a library, and the
      # harness FAILS with a setup message rather than skipping when an engine
      # is missing. So every engine the suite can drive is installed here.
      # Unversioned on purpose: it resolves the Playwright `npm ci` just
      # installed, so package-lock.json keeps pinning the browser revisions.
      # Removing an engine reopens a CI-only failure, not a local one.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
