# Prismatica merge gate — the one choke point.
# The gate runs one EXACT published version, fetched straight from the npm
# registry, so this repository needs no Prismatica dependency of its own:
#     npx --yes prismatica@0.7.2 gate
# Upgrading is deliberate: change that one version below when you choose to.
# `prismatica doctor` tells you which version this file pins and which one you
# are running locally, so any skew between them is visible rather than silent.
name: Prismatica Gate
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  prismatica-gate:
    name: prismatica-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install this repository's own check dependencies
        run: >
          # These are THIS repository's own check dependencies — its
          typechecker,

          # linter, test runner and build. Prismatica itself is NOT installed
          here:

          # the gate step below fetches one exact published version instead.

          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            echo "no npm lock file at the repository root — nothing to install"
          fi
      - name: install the pinned browsers the repository's own checks need
        # The gate runs this repository's checks, which drive real browsers.
        # They fail with a setup message rather than skipping, so every engine
        # the suite can drive has to be here before the gate runs. Unversioned
        # on purpose: it resolves the Playwright `npm ci` just installed, so
        # package-lock.json keeps pinning the browser revisions. Removing an
        # engine reopens a CI-only failure, not a local one.
        run: >
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npx --yes playwright install --with-deps chromium webkit
          else
            echo "no npm lock file at the repository root — no browser checks to prepare"
          fi
      - name: prismatica gate
        run: npx --yes prismatica@0.7.2 gate
