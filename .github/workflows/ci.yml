# Checks for branches and pull requests. Pushes to main are checked AND
# deployed by deploy.yml (lint + tests + build gate the Pages deployment in
# one dependency chain there).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The suite drives real browsers through Playwright as a library, and the
      # harness FAILS with a setup message rather than skipping when an engine
      # is missing. So every engine the suite can drive is installed here.
      # Unversioned on purpose: it resolves the Playwright `npm ci` just
      # installed, so package-lock.json keeps pinning the browser revisions.
      # Removing an engine reopens a CI-only failure, not a local one.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run lint
      - run: npm test
      - run: npm run build
