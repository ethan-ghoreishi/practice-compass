# Checks for branch pushes. Pull requests are checked by the Prismatica Gate
# alone (prismatica-gate.yml), so a lane's push runs the suite once here and
# once there, never a third time. Pushes to main are checked AND deployed by
# deploy.yml, whose check job runs exactly these steps (ci-browser-setup.test.ts).
name: CI

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      dead_mirror_drill:
        description: Blackhole the Azure apt mirror before the browser install, to prove failover on the real runner
        type: boolean
        default: false

# A newer push to the same branch makes the running check moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # About 2.5x a normal run. GitHub's own default is six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Dispatch-only drill: make the runner's first apt mirror unreachable
      # (an address that drops packets, so a connection hangs as it did when
      # the mirror died) and print the mirror setup this image really uses.
      - name: dead-mirror drill
        if: github.event_name == 'workflow_dispatch' && inputs.dead_mirror_drill
        run: |
          echo '10.255.255.1 azure.archive.ubuntu.com' | sudo tee -a /etc/hosts
          cat /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/* 2>/dev/null || true
      # A dead Azure mirror hung `apt-get update` inside the browser install
      # until it was cancelled by hand, at 39 and 55 minutes (2026-10-07). apt's
      # own failover never finished, whatever its timeouts: the dead-mirror drill
      # hung the same way with Acquire::http::Timeout 10. So apt never meets a
      # dead mirror. Each mirror in the image's list (mirror+file) answers one
      # bounded fetch here or is left out; if none answers, the list stays.
      - name: leave unreachable apt mirrors out
        run: |
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          lists=$(grep -rhosE 'mirror\+file:[^[:space:]]+' /etc/apt/sources.list /etc/apt/sources.list.d/ | sed 's/^mirror+file://' | sort -u || true)
          [ -n "$lists" ] || echo '::warning::apt sources list no mirror+file failover on this image'
          for list in $lists; do
            kept=''
            while IFS= read -r line || [ -n "$line" ]; do
              url=${line%%[[:space:]]*}
              case $url in
                http://*|https://*)
                  if curl -fsS --max-time 5 -o /dev/null "${url%/}/dists/$codename/InRelease"; then kept="$kept$line"$'\n'
                  else echo "::warning::apt mirror $url did not answer within 5 s; left out of $list"; fi ;;
                *) kept="$kept$line"$'\n' ;;
              esac
            done < "$list"
            if printf '%s' "$kept" | grep -qE '^https?://'; then printf '%s' "$kept" | sudo tee "$list"
            else echo "::warning::no mirror in $list answered; it is left as it was"; fi
          done
      # The suite drives real browsers through Playwright as a library, and the
      # harness FAILS with a setup message rather than skipping when an engine
      # is missing. So every engine the suite can drive is installed here.
      # Unversioned on purpose: it resolves the Playwright `npm ci` just
      # installed, so package-lock.json keeps pinning the browser revisions.
      # Removing an engine reopens a CI-only failure, not a local one.
      - name: install the pinned browsers
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium webkit
      - run: npm run lint
      - run: npm test
      - run: npm run build
